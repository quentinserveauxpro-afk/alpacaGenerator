<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Générateur d'alpaca</title>
    </head>
    <body>
        <h1>Générateur d'alpaca</h1>

        <div id="alpaca-container">
            <!-- L'alpaca sera affiché ici -->
            <div id="preview-section">
                <img src="alpaca-generator-assets/alpaca/backgrounds/default.png" id="background" alt="Background">
                <img src="alpaca-generator-assets/alpaca/leg/default.png" id="leg" alt="Leg">
                <img src="alpaca-generator-assets/alpaca/nose.png" id="nose" alt="Nose">
                <img src="alpaca-generator-assets/alpaca/mouth/default.png" id="mouth" alt="Mouth">
                <img src="alpaca-generator-assets/alpaca/eyes/default.png" id="eyes" alt="Eyes">
                <img src="alpaca-generator-assets/alpaca/ears/default.png" id="ears" alt="Ears">
                <img src="alpaca-generator-assets/alpaca/hair/default.png" id="hair" alt="Hair">
                <img src="alpaca-generator-assets/alpaca/neck/default.png" id="neck" alt="Neck">
                <img src="" id="accessories" alt="Accessories" style="display:none;">
            </div>
        </div>
        
        <!-- Boutons pour personnaliser l'alpaca -->
        <div id="customization-buttons">
            <h2>Personnaliser votre alpaca</h2>

            <!-- Cheveux -->
            <button id="hair">Cheveux</button>

            <!-- Oreilles -->
            <button id="ears">Oreilles</button>

            <!-- Yeux -->
            <button id="eyes">Yeux</button>

            <!-- Bouche -->
            <button id="mouth">Bouche</button>

            <!-- Cou -->
            <button id="neck">Cou</button>

            <!-- Patte -->
            <button id="leg">Patte</button>

            <!-- Accessoires -->
            <button id="accessory">Accessoires</button>

            <!-- Arrière-plan -->
            <button id="background">Arrière-plan</button>
        </div>
        

        <h2>Style</h2>
    </body>
</html>
